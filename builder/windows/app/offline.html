<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website unavailable</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1a2845}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px;background:linear-gradient(125deg,#eef5ff,#fff 55%,#f2efff);display:grid;place-items:center}
.card{text-align:center;max-width:490px;padding:42px;border:1px solid #e2e9f8;border-radius:23px;background:#ffffffc9;box-shadow:0 18px 55px #536bb018}
.mark{display:grid;place-items:center;margin:auto auto 22px;height:62px;width:62px;background:#e8efff;border-radius:20px;color:#397bee;font-size:29px}
h1{margin:0 0 13px;font-size:27px;letter-spacing:-1px}
p{margin:0;color:#71819b;font-size:14px;line-height:1.75}
small{display:block;color:#8e9fb4;margin-top:18px;font-size:12px}
</style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true">↗</div>
<h1>Couldn't open the website</h1>
<p>This app shows a live, online website. Check your connection and try reopening the app. Some login redirects or external links may also be blocked by security restrictions.</p>
<small>Your original website and backend must stay online.</small></main></body></html>
